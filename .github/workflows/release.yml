name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME DeleteTraces.bat LICENSE --title $env:GITHUB_REF_NAME --generate-notes
